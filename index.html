<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Archive — Game Knowledge Terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>◈ Field Archive — Game Knowledge Terminal</h1>
      <span class="tag">v0.1 — building in public</span>
    </header>

    <input type="text" id="gameSearch" class="game-search" placeholder="Search for a game…" autocomplete="off" />
    <nav class="game-select" id="gameSelect"></nav>

    <main class="console">
      <div class="console-log" id="consoleLog">
        <div class="msg-sys" id="introMsg"></div>
      </div>
      <form class="input-row" id="inputRow">
        <input type="text" id="userInput" placeholder="Ask something…" autocomplete="off" />
        <button type="submit" id="sendBtn">SEND</button>
      </form>
    </main>

    <footer class="footer-note">
      Answers are pulled from a curated knowledge base for each game — built to be accurate on niche
      games that general AI chatbots often guess wrong on.
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
